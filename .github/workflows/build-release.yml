name: Build Windows EXE

# Build a standalone HelloCam.exe on a Windows runner.
#  - Every run uploads the exe as a workflow artifact (good for testing).
#  - Pushing a version tag (e.g. `v0.1.0`) also publishes a GitHub Release
#    with the exe attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # allow manual "Run workflow" builds

permissions:
  contents: write           # needed to create/attach the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build HelloCam.exe
        # onefile so the release is a single double-clickable exe. winsdk /
        # onnxruntime / pyvirtualcam load submodules and native DLLs
        # dynamically, so collect them wholesale or PyInstaller misses them.
        run: >
          pyinstaller --onefile --windowed --name HelloCam
          --icon hellocam/assets/icon.ico
          --add-data "hellocam/assets/icon.ico;hellocam/assets"
          --collect-all winsdk
          --collect-all onnxruntime
          --collect-all pyvirtualcam
          main.py

      - name: Smoke-test the exe (import graph is intact)
        # --check imports winsdk/cv2/onnxruntime and exits, so a clean run means
        # the frozen bundle loaded its modules. It deliberately avoids the camera
        # / Media Foundation APIs, which aren't present on the headless runner.
        run: .\dist\HelloCam.exe --check
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloCam-exe
          path: dist/HelloCam.exe

      - name: Publish Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelloCam.exe
          generate_release_notes: true
